$:
  vscode:
    - imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /root/.bun/install/cache
          - /workspace/.next/cache:cow
      services:
        - vscode
        - docker
      stages:
        - name: install
          script:
            - bun i

"**":
  push:
    sync_to_github:
      runner:
        cpus: 8
      services:
        - docker
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/ArSrNaOS.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"

master:
  push:
    os_eodeploy:
      services:
        - docker
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /workspace/.next/cache
          - /root/.bun/install/cache
      runner:
        cpus: 32
      stages:
        - name: build
          script:
            - bun i
            - bun run build
        - name: 部署我的 eo pages 正式环境
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
          image: tencentcom/deploy-eopages:latest
          script: edgeone pages deploy ./out -n arsrna-os -t $EO_SECRET

    # 部署storybook
    sb_eodeploy:
      services:
        - docker
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          # 使用缓存，同时更新
          - /root/.bun/install/cache
      runner:
        cpus: 16
      stages:
        - name: build
          script:
            - bun i
            - bun run build-storybook
        - name: 部署eo pages
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
          image: tencentcom/deploy-eopages:latest
          script: edgeone pages deploy ./storybook-static -n arsrna-os-storybook -t $EO_SECRET

# ---------------------------------------------------------------------------
# 分支保护：禁止 AI 直接向 demo / master 提交
# 规则说明见 AGENTS.md。AI 的提交必须经 PR 合入。
# 平台侧「仅 PR 合入 + 分支保护」才是硬防线，这里是兜底。
# ---------------------------------------------------------------------------
.guard_no_direct_push: &guard_no_direct_push
  runner:
    cpus: 2
  stages:
    - name: 拦截 AI 直推
      script: |
            COMMITTER_EMAIL=$(git log -1 --pretty=%ae)
            COMMITTER_NAME=$(git log -1 --pretty=%an)
            echo "本次提交: ${COMMITTER_NAME} <${COMMITTER_EMAIL}>"
            case "$COMMITTER_EMAIL$COMMITTER_NAME" in
              *npc*|*bot*|*Bot*|*ai@*|*codebuddy*|*CodeBuddy*|*claude*|*Claude*)
                echo ""
                echo "✗ 检测到 AI 直推 ${CNB_BRANCH}。"
                echo "  AGENTS.md 规定：AI 的变更必须从 demo 切新分支，开 PR 合入。"
                echo "  修复方式：把提交搬到 agent/* 分支，开 PR 到 demo，并回退本次直推。"
                exit 1
                ;;
            esac
            echo "✓ 人类提交，放行"

demo:
  push:
    guard_no_direct_push: *guard_no_direct_push

master:
  push:
    guard_no_direct_push: *guard_no_direct_push
