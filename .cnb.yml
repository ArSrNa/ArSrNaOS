# 构建环境：镜像自带 bun / node / pnpm，无需额外安装
.build: &build
  services:
    - docker
  docker:
    image: docker.cnb.cool/arsrna/dev-image/nodejs
    volumes: &build_cache
      - /root/.bun/install/cache
      - /workspace/.next/cache:cow

# eo pages 部署：密钥引入与镜像
.eo: &eo
  imports:
    - https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
  image: tencentcom/deploy-eopages:latest

$:
  vscode:
    - imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes: *build_cache
      services:
        - vscode
        - docker
      stages:
        - name: install
          script:
            - bun i

  # 推送 Tag 后部署正式环境，Tag 名即 package.json 的 version
  tag_push:
    # 部署 NextJS
    - name: os_eodeploy
      <<: *build
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      runner:
        cpus: 16
      stages:
        - name: build
          script:
            - bun i
            - bun run build
        - name: 部署我的 eo pages 正式环境
          <<: *eo
          script: edgeone pages deploy ./out -n arsrna-os -t $EO_SECRET

    # 部署 Storybook
    - name: sb_eodeploy
      <<: *build
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      runner:
        cpus: 8
      stages:
        - name: build
          script:
            - bun i
            - bun run build-storybook
        - name: 部署eo pages
          <<: *eo
          script: edgeone pages deploy ./storybook-static -n arsrna-os-storybook -t $EO_SECRET

  # 自动生成 Tag：取 package.json 的 version 作为 Tag 名
  auto_tag:
    - docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
      runner:
        cpus: 2
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      stages:
        - name: 从 package.json 读取版本号
          script: echo "##[set-output version=$(node -p "require('./package.json').version")]"
          exports:
            version: VERSION
        - name: 推送 Tag 并触发部署
          script: |
            TAG="$VERSION"
            if [ -z "$TAG" ]; then
              echo "✗ package.json 里没有读出 version"
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "✗ Tag $TAG 已存在。先升 package.json 的 version 再自动打 Tag"
              exit 1
            fi
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✓ 已创建并推送 Tag $TAG，tag_push 流水线将接手部署"

"**":
  push:
    sync_to_github:
      runner:
        cpus: 8
      services:
        - docker
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/ArSrNaOS.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"

# ---------------------------------------------------------------------------
# 分支保护：禁止 AI 直接向 demo / master 提交
# 规则说明见 AGENTS.md。AI 的提交必须经 PR 合入。
# 平台侧「仅 PR 合入 + 分支保护」才是硬防线，这里是兜底。
# ---------------------------------------------------------------------------
.guard_no_direct_push: &guard_no_direct_push
  runner:
    cpus: 2
  stages:
    - name: 拦截 AI 直推
      script: |
        COMMITTER_EMAIL=$(git log -1 --pretty=%ae)
        COMMITTER_NAME=$(git log -1 --pretty=%an)
        echo "本次提交: ${COMMITTER_NAME} <${COMMITTER_EMAIL}>"
        case "$COMMITTER_EMAIL$COMMITTER_NAME" in
          *npc*|*bot*|*Bot*|*ai@*|*codebuddy*|*CodeBuddy*|*claude*|*Claude*)
            echo ""
            echo "✗ 检测到 AI 直推 ${CNB_BRANCH}。"
            echo "  AGENTS.md 规定：AI 的变更必须从 demo 切新分支，开 PR 合入。"
            echo "  修复方式：把提交搬到 agent/* 分支，开 PR 到 demo，并回退本次直推。"
            exit 1
            ;;
        esac
        echo "✓ 人类提交，放行"

demo:
  push:
    guard_no_direct_push: *guard_no_direct_push

master:
  push:
    guard_no_direct_push: *guard_no_direct_push
