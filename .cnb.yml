$:
  vscode:
    - imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      runner:
        cpus: 16
      docker: &docker_node
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes: &vol_build
          - /root/.bun/install/cache
          - /workspace/.next/cache:cow
      services:
        - vscode
        - docker
      stages:
        - name: install
          script:
            - bun i

"**":
  push:
    sync_to_github:
      runner:
        cpus: 2
      services:
        - docker
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/ArSrNaOS.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"

master:
  push:
    os_eodeploy:
      services:
        - docker
      docker: *docker_node
      runner:
        cpus: 16
      stages:
        - name: build
          script:
            - bun i
            - bun run build
        - name: 部署我的 eo pages 正式环境
          imports: &eo_imports
            - https://cnb.cool/arsrna/env/-/blob/main/tencent.yml
          image: &eo_image tencentcom/deploy-eopages:latest
          script: edgeone pages deploy ./out -n arsrna-os -t $EO_SECRET

    # 部署storybook
    sb_eodeploy:
      services:
        - docker
      docker: *docker_node
      runner:
        cpus: 8
      stages:
        - name: build
          script:
            - bun i
            - bun run build-storybook
        - name: 部署eo pages
          imports: *eo_imports
          image: *eo_image
          script: edgeone pages deploy ./storybook-static -n arsrna-os-storybook -t $EO_SECRET
